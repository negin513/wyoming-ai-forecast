name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # mkdocs-jupyter can only render notebooks that live under docs_dir, so copy
      # the root-level notebooks in (copy, not symlink, since mkdocs-jupyter
      # rewrites the file it converts and a symlink would corrupt the source).
      - run: cp 01_wyoming_ai_forecast.ipynb 02_stormscope_wyoming_demo.ipynb docs/
      - name: Build with strict mode
        run: mkdocs build --strict
