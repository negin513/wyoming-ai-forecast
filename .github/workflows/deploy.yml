name: Deploy

# Publishes to GitHub Pages at https://<owner>.github.io/wyoming-ai-forecast/
#
# ONE-TIME SETUP (required): repo Settings -> Pages -> Source = "GitHub Actions".
# The workflow's GITHUB_TOKEN cannot create a Pages site itself, so this cannot be
# automated from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # mkdocs-jupyter can only render notebooks that live under docs_dir, so copy
      # the root-level notebooks in (copy, not symlink, since mkdocs-jupyter
      # rewrites the file it converts and a symlink would corrupt the source).
      - run: cp 01_wyoming_ai_forecast.ipynb 02_stormscope_wyoming_demo.ipynb docs/

      - uses: actions/configure-pages@v5
        id: pages

      # Build against the Pages URL so canonical links and the sitemap are correct,
      # rather than the placeholder site_url committed in mkdocs.yml.
      - name: Build site
        run: mkdocs build --strict
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
