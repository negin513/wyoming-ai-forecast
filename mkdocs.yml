site_name: Wyoming AI Weather Forecast
site_description: Earth2Studio AI weather forecast notebooks for University of Wyoming training
site_url: !ENV [SITE_URL, "https://negin513.github.io/wyoming-ai-forecast/"]
repo_url: https://github.com/negin513/wyoming-ai-forecast
docs_dir: docs
site_dir: site

# Notebooks live at the repo root (so they're easy to open/run directly) and are
# copied into docs/ before each build (see CI/deploy workflows), since
# mkdocs-jupyter can only render notebooks that live under docs_dir.
nav:
  - Home: index.md
  - Wyoming AI forecast: 01_wyoming_ai_forecast.ipynb
  - StormScope Nowcasting over Wyoming: 02_stormscope_wyoming_demo.ipynb
  - StormScope Nowcasting over Wyoming (v2): 02_stormscope_wyoming_demo_v2.ipynb

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
  font:
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: light
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: dark
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/logo/nvidia-logo.svg
  favicon: assets/logo/nvidia-logo.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/css/color-schemes.css
  - assets/css/fonts.css
  - assets/css/custom-material.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
